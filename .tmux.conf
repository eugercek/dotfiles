set -g mode-keys vi # In copy mode use vim bindings
set -g mouse on # Mouse can: select pane, resize, scroll
# set -g mouse-override off # Let neovim handle mouse inside panes
set -sg escape-time 0 # This one makes neovim esc snappy
set -g set-clipboard on # Use system clipboard
setw -g aggressive-resize on # Use current client size for resizing
set -g base-index 1 # 0 is far away, useful for M-N window switching
setw -g pane-base-index 1 # ''
set -g renumber-windows on # When a window is deleted renumber the windows
set -g automatic-rename on # Rename windows based on pane title
setw -g automatic-rename-format '#{=25:pane_title}'
set -g status-interval 30
set -g history-limit 1000000 # keep more scrollback
set -g detach-on-destroy off

set -g allow-passthrough on # passthrough for notifications etc
# Use command+shift+click
set -ga terminal-features ",xterm-ghostty:RGB:focus:ccolour:cstyle:hyperlinks:extkeys"
set -as terminal-features ",*:hyperlinks"

# More smooth
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# Don't quit copy mode when selecting via vi bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi i send-keys -X cancel

# pane navigation
# TODO: umut
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?g?(view|l?n?vim?x?|vimdiff)$'"
bind -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"
bind h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

# pane resize, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window management
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind & kill-window

# Reversed on purpose: n sits left of p on the keyboard, so my hand reads n as
# "go back" and p as "go forward". Bind them to match that instinct rather than
# tmux's defaults (n=next, p=previous), which I always get wrong.
bind n previous-window
bind p next-window

# move current window left/right (paired with super+shift+{p,n} in ghostty)
# Reversed to match n/p above: N sits left, so it moves the window "back" (left),
# and P moves it "forward" (right).
bind -r N swap-window -d -t -1
bind -r P swap-window -d -t +1

# move current pane → window number; blank target breaks it out to a new window
bind m command-prompt -p "move pane to window (blank = new):" "if-shell -F '#{!=:%1,}' 'join-pane -h -t \":%1\"' 'break-pane'"

# splits open in current directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S choose-session

# session management (pick paired with super+r in ghostty; rename via prefix R)
bind g display-popup -E -w 60% -h 40% "$HOME/.local/bin/tmux-pick-session"
bind R command-prompt -p "rename session:" "rename-session -- '%%'"

# reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Terminal capabilities: truecolor, focus events, cursor color/style for ghostty,
# and OSC-8 hyperlink passthrough so tools like `eza --hyperlink` render clickable.
set -g default-terminal "tmux-256color"
set -s extended-keys on

# let programs detect pane focus changes
set -g focus-events on

# Refresh VSCode/Claude Code vars per client so `/ide`, @file, selection sync work in nested tmux.
set-option -ga update-environment "CLAUDECODE CLAUDE_CODE_SSE_PORT ENABLE_IDE_INTEGRATION VSCODE_IPC_HOOK_CLI VSCODE_GIT_IPC_HANDLE VSCODE_INJECTION TERM_PROGRAM TERM_PROGRAM_VERSION"


# Tmux Status Line
set -g status-position top
set -g status-left ''
set -g status-right '#S '
set -g status-justify centre
set -g status-style bg=default,fg=default
set -g window-status-style bg=default,fg=default
set -g window-status-current-style bg=default,fg=default,bold,underscore
set -g window-status-separator ' · '
set -g window-status-format '#W'
set -g window-status-current-format '#W'
set -g status-format[1] ''

# Hide status bar when only have 1 window 
if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"
set-hook -g window-linked 'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
set-hook -g window-unlinked 'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'

# Keep command/message UI understated and consistent with the status line.
set -g message-style bg=default,fg=default
set -g message-command-style bg=default,fg=default
set -g popup-style bg=default,fg=default
set -g popup-border-style fg=colour240

# Better selection mode colors
set -g mode-style bg=colour240,fg=colour231

# I also use these commands regularly
# move-pane -t :N

# stacked pane toggle
unbind t
bind t if-shell -F '#{pane_at_top}' 'resize-pane -y 0; select-pane -D; resize-pane -y 100%' 'resize-pane -y 0; select-pane -U; resize-pane -y 100%'
